<div class="expenses-container">

  <!-- Header -->
  <div class="section-header">
    <h3 class="section-title">Expenses</h3>
    <app-overlay-menu triggerIcon="plus" [actions]="addExpenseActions()" triggerTooltip="Add expense" />
    <!-- <button class="icon-btn add-btn" (click)="addNew()" title="Add expense">
      <lucide-icon name="plus" [size]="16"></lucide-icon>
    </button> -->
  </div>

  @if (expenses().length > 0) {
    <div class="scroll-container">
      <div class="ledger-rows">
        @for (exp of expenses(); track exp.id) {
          <div class="ledger-row">
            <app-date-picker
              mode="date"
              displayFormat="compact"
              [value]="toDate(exp.date())"
              (valueChange)="updateDate(exp, $event)">
            </app-date-picker>

            <lucide-icon [name]="categoryIcon(exp.category())" [size]="16" class="category-icon" [style.color]="categoryColor(exp.category())"></lucide-icon>

            <app-rich-textarea
              [value]="exp.details() ?? ''"
              placeholder="Details..."
              [multiline]="false"
              (saveValue)="updateDetails(exp, $event)">
            </app-rich-textarea>

            <app-editable-badge
              [value]="exp.amount()"
              [flat]="true"
              [step]="1"
              [min]="0"
              [decimalPlaces]="2"
              prefix="€"
              (save)="updateAmount(exp, $event)">
            </app-editable-badge>
          </div>
        }
      </div>
    </div>
  } @else {
    <p class="empty-hint">No expenses recorded yet.</p>
  }

</div>
