<div class="bookings-container">

  <!-- Daily costs -->
  <section class="cost-section">
    <h3 class="section-title">Daily Costs</h3>
    <div class="scroll-container">
      <div class="ledger-rows">
        @for (cat of dailyCategories; track cat.id) {
          <div class="ledger-row">
            <lucide-icon [name]="cat.icon" [size]="18" class="category-icon" [style.color]="getCategoryColor(cat.id)"></lucide-icon>
            <span class="category-label">{{ cat.label }}</span>
            <app-cost
              [estimatedCost]="estimatedCostMap()[cat.id]"
              [actualCost]="actualCostMap()[cat.id]"
              [actualReadonly]="true"
              [aggregate]="true"
              [actualRatio]="actualRatioMap()[cat.id]"
              [breakdown]="breakdownMap()[cat.id]"
              [decimalPlaces]="0"
              (saveEstimated)="updateEstimatedCost(cat.id, $event)">
            </app-cost>
          </div>
        }
      </div>
    </div>
  </section>

  <!-- One-time costs -->
  <section class="cost-section">
    <h3 class="section-title">One-time Costs</h3>
    <div class="scroll-container">
      <div class="ledger-rows">
        @for (cat of oneTimeCategories; track cat.id) {
          <div class="ledger-row">
            <lucide-icon [name]="cat.icon" [size]="18" class="category-icon" [style.color]="getCategoryColor(cat.id)"></lucide-icon>
            <span class="category-label">{{ cat.label }}</span>
            <app-cost
              [estimatedCost]="estimatedCostMap()[cat.id]"
              [actualCost]="actualCostMap()[cat.id]"
              [actualReadonly]="true"
              [aggregate]="true"
              [actualRatio]="actualRatioMap()[cat.id]"
              [breakdown]="breakdownMap()[cat.id]"
              [decimalPlaces]="0"
              (saveEstimated)="updateEstimatedCost(cat.id, $event)">
            </app-cost>
          </div>
        }
      </div>
    </div>
  </section>

  <!-- Daily expenses (food/misc ledger) -->
  <app-expenses [place]="place()"></app-expenses>

  <app-place-bookings [place]="place()"></app-place-bookings>
</div>
