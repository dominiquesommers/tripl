<div class="activities-container">
<!--  <h3 class="section-title">Activities</h3>-->
  @for (act of activities(); track act.id) {
    <div class="activity-item"
     [class.excluded]="act.status() === 'excluded'"
     [class.skipped]="act.status() === 'skipped'">

      @if (authService.canEdit()) {
        <div class="activity-actions-top">
          @if (act.status() !== 'excluded') {
            <button class="icon-btn skip"
                    [class.active]="act.status() === 'skipped'"
                    (click)="toggleSkipped(act)"
                    [title]="act.status() === 'skipped' ? 'Mark as planned' : 'Mark as skipped'">
              <lucide-icon name="skip-forward" [size]="14"></lucide-icon>
            </button>
          }

          <button class="icon-btn visibility"
                  (click)="toggleExcluded(act)"
                  [title]="act.status() === 'excluded' ? 'Include in trippp' : 'Exclude from trip'">
            <lucide-icon [name]="act.status() === 'excluded' ? 'eye-off' : 'eye'" [size]="14"></lucide-icon>
          </button>

          <button class="icon-btn delete" (click)="deleteActivity(act)">
            <lucide-icon name="trash-2" [size]="14"></lucide-icon>
          </button>
        </div>
      }

      <div class="seamless-text-container">
        <app-rich-textarea
          [value]="act.description()"
          [placeholder]="'Add description...'"
          (saveValue)="updateActivity(act, { description: $event || undefined })">
        </app-rich-textarea>
      </div>

      @if (authService.canEdit()) {
        <div class="cost-row">
          <app-cost
            [estimatedCost]="act.estimated_cost() ?? 0"
            [actualTotal]="act.actual_cost()"
            [isPaid]="act.isPaid()"
            [expenses]="act.expenses()"
            [decimalPlaces]="2"
            (saveEstimated)="updateActivity(act, { estimated_cost: $event })"
            (saveActual)="updateActivity(act, { actual_cost: $event })"
            (removeActual)="removeActual(act)"
            (addExpense)="addExpense(act, $event)"
            (updateExpense)="updateExpense($event)"
            (deleteExpense)="deleteExpense($event)"
            (fetchExpenses)="tripService.fetchExpenseDetails(act.id, 'activity').subscribe()">
          </app-cost>
        </div>
      }
    </div>
  }

  @if (authService.canEdit()) {
    <div class="activity-item add-ghost"
       [class.editing]="isAdding()"
       (click)="!isAdding() && isAdding.set(true)">

      <div class="seamless-text-container">
        <app-rich-textarea
          [value]="''"
          placeholder="Add new activity..."
          (saveValue)="onAddActivity($event)">
        </app-rich-textarea>
      </div>

      @if (isAdding()) {
        <div class="cost-row">
           <span class="hint-text">Shift+Enter to Save • Esc to Cancel</span>
        </div>
      }
    </div>
  }
</div>
