<div class="overview-container">
  <section class="chart-section">
    <div class="section-header">
      <h4>Overview</h4>
    </div>
    <div class="table-card">
      <div class="table-header cost-row-header">
        <span></span>
        <span>Cost</span>
      </div>
      <div class="table-body">
        <div class="country-group">
          <div class="country-row cost-row">
            <span class="name">Total</span>
            <app-cost
              [estimatedCost]="total2().estimated.total"
              [actualCost]="total2().improvedEstimate.total"
              [readonly]="true"
              [aggregate]="true"
              [breakdown]="totalBreakdown()"
              [decimalPlaces]="0">
            </app-cost>
          </div>
          <div class="country-row cost-row">
            <span class="name">To date</span>
            <app-cost
              [estimatedCost]="toDate().estimated.total"
              [actualCost]="toDate().improvedEstimate.total"
              [readonly]="true"
              [aggregate]="true"
              [breakdown]="toDateBreakdown()"
              [decimalPlaces]="0">
            </app-cost>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="chart-section">
    <div class="section-header">
      <h4>Spending Trend</h4>
      <div class="header-actions">
        <div class="country-filter">
          <button
            class="filter-select-btn"
            type="button"
            (click)="isCountryPanelOpen.set(!isCountryPanelOpen())">
            <span>{{ countryFilterLabel() }}</span>
            <lucide-icon name="{{ !isCountryPanelOpen() ? 'chevron-down' : 'chevron-up' }}" [size]="12"></lucide-icon>
          </button>
          @if (isCountryPanelOpen()) {
            <div class="filter-panel">
              <label class="filter-option select-all">
                <input
                  type="checkbox"
                  [checked]="isAllCountriesSelected()"
                  (change)="toggleAllCountries()">
                <span>Select All</span>
              </label>
              <div class="filter-divider"></div>
              @for (country of visitedCountries(); track country.id) {
                <label class="filter-option">
                  <input
                    type="checkbox"
                    [checked]="isCountrySelected(country)"
                    (change)="toggleCountry(country)">
                  <span>{{ countryFlags[country.name] || '🏳️' }} {{ country.name }}</span>
                </label>
              }
            </div>
          }
        </div>
        <button
          class="icon-btn toggle-btn"
          [class.is-active]="isCumulative()"
          (click)="isCumulative.set(!isCumulative())"
          [title]="isCumulative() ? 'Switch to daily' : 'Switch to cumulative'">
          <lucide-icon
            [name]="isCumulative() ? 'sigma' : 'activity'"
            [size]="14">
          </lucide-icon>
        </button>
        <button class="icon-btn" (click)="openFullscreen('line')">
          <lucide-icon name="maximize-2" [size]="14"></lucide-icon>
        </button>
      </div>
    </div>
    <div class="chart-wrapper">
      <canvas baseChart [data]="lineChartData()" [options]="lineChartOptions" [type]="'line'"></canvas>
    </div>
  </section>

  <section class="chart-section">
    <div class="section-header">
      <h4>Daily Cost per Country</h4>
      <div class="header-actions">
        <button
          class="icon-btn toggle-btn"
          [class.is-active]="isBarCumulative()"
          (click)="isBarCumulative.set(!isBarCumulative())"
          [title]="isBarCumulative() ? 'Switch to daily' : 'Switch to total'">
          <lucide-icon
            [name]="isBarCumulative() ? 'sigma' : 'activity'"
            [size]="14">
          </lucide-icon>
        </button>
        <button class="icon-btn" (click)="openFullscreen('bar')">
          <lucide-icon name="maximize-2" [size]="14"></lucide-icon>
        </button>
      </div>
    </div>
    <div class="chart-wrapper bar-wrapper">
      <canvas baseChart [data]="barChartData()" [options]="barChartOptions" [type]="'bar'"></canvas>
    </div>
  </section>
  <section class="chart-section">
    <div class="section-header">
      <h4>Daily Cost per Country</h4>
    </div>
    <div class="table-card">
      <div class="table-header cost-row-header">
        <span>Country</span>
        <span>Cost</span>
      </div>

      <div class="table-body">
        @for (country of visitedCountries(); track country.id) {
          <div class="country-group">
            <div class="country-row cost-row">
              <span class="name">{{ country.name }}</span>
              <app-cost
                [estimatedCost]="country.cost().estimated.total"
                [actualCost]="country.cost().improvedEstimate.total"
                [readonly]="true"
                [aggregate]="true"
                [breakdown]="countryBreakdown(country)"
                [decimalPlaces]="0">
              </app-cost>
            </div>

  <!--          @for (visit of country.visits(); track visit.id) {-->
  <!--            <div class="place-row">-->
  <!--              <span class="place-name">{{ visit.place.name() }}</span>-->
  <!--              <app-cost-->
  <!--                 [estimatedCost]="visit.place.accommodation_cost()"-->
  <!--                 [actualCost]="visit.place.actual_accommodation_cost()"  TODO: confirm this accessor exists-->
  <!--                 [readonly]="true"-->
  <!--                 [decimalPlaces]="0">-->
  <!--              </app-cost>-->
  <!--            </div>-->
  <!--          }-->
          </div>
        }
      </div>
    </div>
  </section>
</div>
